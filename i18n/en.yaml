# About Section
- id: about_title
  translation: "About iBricks"
- id: about_description
  translation: "iBricks is a global infrastructure initiative built on blockchain. We enable communities to tokenize real-world assets, establish secure digital identities, and participate in decentralized governance. Our mission is to make ownership, equity, and opportunity accessible to all—without borders or bias."

# Services Section
- id: services_title
  translation: "Our Services"
- id: service_tokenization_title
  translation: "Asset Tokenization"
- id: service_tokenization_desc
  translation: "We convert physical assets into digital tokens for transparent, fractional ownership."
- id: service_identity_title
  translation: "Digital Identity"
- id: service_identity_desc
