# Mission Section
- id: mission_title
  translation: "Our Mission"
- id: mission_description
  translation: "We envision a decentralized world where every person and community can access secure, transparent, and equitable infrastructure. iBricks is committed to building tools that scale across cultures, geographies, and economic conditions—empowering the next billion users."

