# Sekcja O nas
- id: about_title
  translation: "O iBricks"
- id: about_description
  translation: "iBricks to globalna inicjatywa infrastrukturalna oparta na technologii blockchain. Umożliwiamy społecznościom tokenizację rzeczywistych aktywów, tworzenie bezpiecznych cyfrowych tożsamości i udział w zdecentralizowanym zarządzaniu. Naszą misją jest zapewnienie dostępu do własności, kapitału i możliwości dla wszystkich — bez granic i uprzedzeń."

