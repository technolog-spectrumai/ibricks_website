# Sekcja Misja
- id: mission_title
  translation: "Nasza misja"
- id: mission_description
  translation: "Wizją iBricks jest zdecentralizowany świat, w którym każda osoba i społeczność ma dostęp do bezpiecznej, przejrzystej i sprawiedliwej infrastruktury. Budujemy narzędzia skalowalne w różnych kulturach, regionach i warunkach gospodarczych — aby wzmocnić kolejne miliardy użytkowników."

