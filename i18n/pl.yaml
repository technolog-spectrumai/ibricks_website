- id: service_identity_title
  translation: "Cyfrowa tożsamość"
- id: service_identity_desc
  translation: "Systemy tożsamości oparte na samodzielnym zarządzaniu dla bezpiecznego dostępu, weryfikacji i budowania reputacji."
- id: service_dao_title
  translation: "Zarządzanie DAO"
- id: service_dao_desc
  translation: "Konfigurowalne struktury DAO umożliwiające podejmowanie decyzji i alokację zasobów przez społeczność."
- id: service_shares_title
  translation: "Cyfrowe udziały"
- id: service_shares_desc
  translation: "Programowalne narzędzia kapitałowe dla startupów, spółdzielni i lokalnych inicjatyw."
- id: service_platform_title
  translation: "Platforma społecznościowa"
- id: service_platform_desc
  translation: "Narzędzia do współpracy w zakresie głosowania, propozycji i przejrzystej komunikacji."
- id: service_access_title
  translation: "Globalny dostęp"
- id: service_access_desc
  translation: "Infrastruktura zaprojektowana z myślą o regionach rozwijających się i cyfrowo wykluczonych społecznościach."

