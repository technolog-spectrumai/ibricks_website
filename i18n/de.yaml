# Sekcja O nas
- id: about_title
  translation: "Über iBricks"
- id: about_description
  translation: "iBricks ist eine globale Infrastrukturinitiative, die auf Blockchain-Technologie basiert. Wir ermöglichen Gemeinschaften die Tokenisierung realer Vermögenswerte, die Schaffung sicherer digitaler Identitäten und die Teilnahme an dezentralisierter Governance. Unsere Mission ist es, allen Menschen – unabhängig von Grenzen oder Vorurteilen – Zugang zu Eigentum, Kapital und Möglichkeiten zu bieten."

