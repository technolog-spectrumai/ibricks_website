# Mission Section
- id: mission_title
  translation: "Notre mission"
- id: mission_description
  translation: "Nous imaginons un monde décentralisé où chaque personne et chaque communauté peut accéder à une infrastructure sécurisée, transparente et équitable. iBricks s’engage à créer des outils qui s’adaptent aux cultures, aux géographies et aux conditions économiques — pour autonomiser le prochain milliard d’utilisateurs."

