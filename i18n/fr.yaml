# About Section
- id: about_title
  translation: "À propos de iBricks"
- id: about_description
  translation: "iBricks est une initiative d’infrastructure mondiale basée sur la blockchain. Nous permettons aux communautés de tokeniser des actifs réels, de créer des identités numériques sécurisées et de participer à une gouvernance décentralisée. Notre mission est de rendre la propriété, l’équité et les opportunités accessibles à tous — sans frontières ni préjugés."

# Services Section
- id: services_title
  translation: "Nos services"
- id: service_tokenization_title
  translation: "Tokenisation d’actifs"
- id: service_tokenization_desc
  translation: "Nous transformons les actifs physiques en jetons numériques pour une propriété fractionnée et transparente."
- id: service_identity_title
  translation: "Identité numérique"
- id: service_identity_desc
  translation: "Systèmes d’identité auto-souveraine pour un accès sécurisé, une vérification fiable et une réputation construite."
- id: service_dao_title
  translation: "Gouvernance DAO"
- id: service_dao_desc
  translation: "Cadres DAO personnalisables pour une prise de décision communautaire et une allocation des ressources."
- id: service_shares_title
  translation: "Actions numériques"
- id: service_shares_desc
  translation: "Outils d’équité programmables pour les startups, les coopératives et les initiatives locales."
- id: service_platform_title
  translation: "Plateforme communautaire"
- id: service_platform_desc
  translation: "Outils de collaboration pour le vote, les propositions et une communication transparente."
- id: service_access_title
  translation: "Accès mondial"
- id: service_access_desc
  translation: "Infrastructure conçue pour les régions émergentes et les communautés numériquement marginalisées."

